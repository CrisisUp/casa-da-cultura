name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: casa_da_cultura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit & integration tests (Jest)
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/casa_da_cultura?schema=public"
          NEXTAUTH_SECRET: "ci-secret-key-for-testing-purposes-only"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (Playwright)
        run: npx playwright test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/casa_da_cultura?schema=public"
          NEXTAUTH_SECRET: "ci-secret-key-for-testing-purposes-only"
          PORT: 3000
